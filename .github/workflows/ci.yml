name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format check
        run: |
          gofmt -l .
          test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        shell: bash
        run: |
          # macOS arm64 runners abort race-instrumented test binaries with a
          # "dyld: missing LC_UUID" dyld error (Go race runtime incompatibility
          # with the current macOS). Run the race detector on the other OSes.
          race="-race"
          if [ "$RUNNER_OS" = "macOS" ]; then
            race=""
            echo "Skipping -race on macOS (known dyld LC_UUID incompatibility)."
          fi
          go test ./... -count=1 $race

  build:
    name: Build (${{ matrix.target }})
    needs: test
    if: github.event_name == 'release'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux/amd64
            name: linux-amd64
          - target: linux/arm64
            name: linux-arm64
          - target: darwin/amd64
            name: darwin-amd64
          - target: darwin/arm64
            name: darwin-arm64
          - target: windows/amd64
            name: windows-amd64
          - target: windows/arm64
            name: windows-arm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          goos="${TARGET%/*}"
          goarch="${TARGET#*/}"
          ext=""
          if [ "$goos" = "windows" ]; then ext=".exe"; fi
          mkdir -p dist
          CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
            go build -trimpath -ldflags="-s -w -X github.com/Jackson2403/envsync/internal/cli.Version=${{ github.ref_name }}" \
            -o "dist/envsync-$goos-$goarch$ext" ./cmd/envsync
        env:
          TARGET: ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: envsync-${{ matrix.name }}
          path: dist/*

  release:
    name: Publish release assets
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
