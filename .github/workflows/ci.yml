name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Format check
        run: |
          gofmt -l .
          test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        shell: bash
        run: |
          # macOS arm64 runners occasionally crash Go -race test binaries with a
          # transient "dyld: missing LC_UUID" abort. Retry to self-heal.
          for i in 1 2 3; do
            if go test ./... -race -count=1; then
              exit 0
            fi
            echo "Attempt $i failed; retrying in 5s..."
            sleep 5
          done
          echo "go test failed after 3 attempts"
          exit 1

  build:
    name: Build (${{ matrix.target }})
    needs: test
    if: github.event_name == 'release'
    strategy:
      matrix:
        target:
          - linux/amd64
          - linux/arm64
          - darwin/amd64
          - darwin/arm64
          - windows/amd64
          - windows/arm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        run: |
          goos="${TARGET%/*}"
          goarch="${TARGET#*/}"
          ext=""
          if [ "$goos" = "windows" ]; then ext=".exe"; fi
          mkdir -p dist
          CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
            go build -trimpath -ldflags="-s -w -X github.com/Jackson2403/envsync/internal/cli.Version=${{ github.ref_name }}" \
            -o "dist/envsync-$goos-$goarch$ext" ./cmd/envsync
        env:
          TARGET: ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: envsync-${{ matrix.target }}
          path: dist/*

  release:
    name: Publish release assets
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
